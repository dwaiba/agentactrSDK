version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    groups:
      sqlx:
        patterns:
          - sqlx-*
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: /docker/agentactr-runtime
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
      - runtime-image

  - package-ecosystem: docker
    directory: /docker/agentactr-cli-static
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
      - cli-image
