name: Security

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  # schedule:
  #   - cron: "21 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: rust

      - uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  supply-chain-metadata:
    name: Supply-chain metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Docker bases are digest-pinned and Apache-licensed
        run: |
          set -euo pipefail
          for dockerfile in docker/agentactr-runtime/Dockerfile docker/agentactr-cli-static/Dockerfile; do
            test -f "${dockerfile}"
            ! rg -n 'UNLICENSED' "${dockerfile}"
            rg -n 'org.opencontainers.image.licenses="Apache-2.0"' "${dockerfile}"
            awk '/^FROM / && $2 !~ /^--/ { print FILENAME ":" FNR ":" $0 } /^FROM / && $2 ~ /^--/ { print FILENAME ":" FNR ":" $0 }' "${dockerfile}" |
              while IFS= read -r line; do
                case "${line}" in
                  *" AS verify"*) continue ;;
                  *@sha256:*) ;;
                  *) echo "Docker FROM is not digest-pinned: ${line}" >&2; exit 1 ;;
                esac
              done
          done

      - name: GitHub Actions references are explicit
        run: |
          set -euo pipefail
          if rg -n '^[[:space:]]*-?[[:space:]]*uses: [^@[:space:]#]+($|[[:space:]]+#)' .github/workflows; then
            echo "Every external action reference must include an immutable commit SHA." >&2
            exit 1
          fi
          unpinned_actions="$(
            rg -n '^[[:space:]]*-?[[:space:]]*uses: [^@[:space:]#]+@[^[:space:]#]+' .github/workflows |
              rg -v '@[0-9A-Fa-f]{40}([[:space:]]+#.*)?$' || true
          )"
          if [ -n "${unpinned_actions}" ]; then
            printf '%s\n' "${unpinned_actions}" >&2
            echo "Every external action reference must be pinned to a 40-character commit SHA; put tag names in comments only." >&2
            exit 1
          fi
