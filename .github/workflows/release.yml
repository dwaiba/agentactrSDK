name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
      release_notes:
        description: Optional curated release notes to place above generated notes
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "${version}" || { echo "release version is required" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-binaries:
    name: Build CLI binary (${{ matrix.target }})
    if: ${{ false }}
    needs: resolve-version
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: '["ubuntu-latest"]'
            binary_path: target/release/agentactr
          - target: aarch64-unknown-linux-gnu
            runs_on: '["ubuntu-24.04-arm"]'
            binary_path: target/release/agentactr
          - target: aarch64-apple-darwin
            runs_on: '["self-hosted","macOS","ARM64","agentactr-release-macos-arm64"]'
            binary_path: target/release/agentactr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify native target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '/^host:/ { print $2 }')"
          test "${host}" = "${TARGET}" || {
            echo "runner host ${host} does not match release target ${TARGET}" >&2
            exit 1
          }

      - name: Build release binary
        run: cargo build --release --bin agentactr

      - name: Prepare macOS signing credentials
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ vars.MACOS_NOTARY_KEYCHAIN_PROFILE }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/agentactr-release-signing.keychain-db"
          profile="${MACOS_NOTARY_KEYCHAIN_PROFILE:-agentactr-release-notary}"

          if [ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ]; then
            test -n "${MACOS_CERTIFICATE_PASSWORD:-}" || { echo "MACOS_CERTIFICATE_PASSWORD secret is required when MACOS_CERTIFICATE_P12_BASE64 is set" >&2; exit 1; }
            test -n "${MACOS_KEYCHAIN_PASSWORD:-}" || { echo "MACOS_KEYCHAIN_PASSWORD secret is required when importing macOS signing credentials" >&2; exit 1; }
            printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/agentactr-release-signing.p12"
            security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}"
            security set-keychain-settings -lut 21600 "${keychain}"
            security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}"
            security import "${RUNNER_TEMP}/agentactr-release-signing.p12" \
              -k "${keychain}" \
              -P "${MACOS_CERTIFICATE_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/productsign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain}"
            security list-keychains -d user -s "${keychain}" "$(security default-keychain | tr -d '"')"
          else
            keychain="$(security default-keychain | tr -d '"')"
          fi

          app_identity="${MACOS_CODESIGN_IDENTITY:-$(security find-identity -v -p codesigning "${keychain}" | awk -F '"' '/Developer ID Application/ { print $2; exit }')}"
          installer_identity="${MACOS_INSTALLER_IDENTITY:-$(security find-identity -v -p basic "${keychain}" | awk -F '"' '/Developer ID Installer/ { print $2; exit }')}"
          test -n "${app_identity}" || { echo "Developer ID Application identity is required for macOS release binaries" >&2; exit 1; }
          test -n "${installer_identity}" || { echo "Developer ID Installer identity is required for the macOS pkg release asset" >&2; exit 1; }
          security find-identity -v -p codesigning "${keychain}" | grep -F "${app_identity}" >/dev/null
          security find-identity -v -p basic "${keychain}" | grep -F "${installer_identity}" >/dev/null

          if [ -n "${MACOS_NOTARY_APPLE_ID:-}" ] || [ -n "${MACOS_NOTARY_PASSWORD:-}" ] || [ -n "${MACOS_NOTARY_TEAM_ID:-}" ]; then
            test -n "${MACOS_NOTARY_APPLE_ID:-}" || { echo "MACOS_NOTARY_APPLE_ID secret is required for notary profile creation" >&2; exit 1; }
            test -n "${MACOS_NOTARY_PASSWORD:-}" || { echo "MACOS_NOTARY_PASSWORD secret is required for notary profile creation" >&2; exit 1; }
            test -n "${MACOS_NOTARY_TEAM_ID:-}" || { echo "MACOS_NOTARY_TEAM_ID secret is required for notary profile creation" >&2; exit 1; }
            xcrun notarytool store-credentials "${profile}" \
              --apple-id "${MACOS_NOTARY_APPLE_ID}" \
              --team-id "${MACOS_NOTARY_TEAM_ID}" \
              --password "${MACOS_NOTARY_PASSWORD}" \
              --keychain "${keychain}"
          fi
          xcrun notarytool history --keychain-profile "${profile}" --keychain "${keychain}" >/dev/null

          {
            echo "MACOS_RELEASE_KEYCHAIN=${keychain}"
            echo "MACOS_CODESIGN_IDENTITY_EFFECTIVE=${app_identity}"
            echo "MACOS_INSTALLER_IDENTITY_EFFECTIVE=${installer_identity}"
            echo "MACOS_NOTARY_PROFILE_EFFECTIVE=${profile}"
          } >> "${GITHUB_ENV}"

      - name: Sign and notarize macOS CLI binary
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          BINARY_PATH: ${{ matrix.binary_path }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/notary
          asset="agentactr-${VERSION}-${TARGET}"
          codesign --force --options runtime --timestamp --sign "${MACOS_CODESIGN_IDENTITY_EFFECTIVE}" "${BINARY_PATH}"
          codesign --verify --strict --verbose=4 "${BINARY_PATH}"
          codesign -dv --verbose=4 "${BINARY_PATH}" 2>&1 | tee "dist/${asset}.codesign.txt"
          grep -F 'Signature=adhoc' "dist/${asset}.codesign.txt" && { echo "macOS release binary must not be ad-hoc signed" >&2; exit 1; }
          grep -E 'TeamIdentifier=[A-Z0-9]+' "dist/${asset}.codesign.txt" >/dev/null

          cp "${BINARY_PATH}" "dist/notary/${asset}"
          chmod 0755 "dist/notary/${asset}"
          (
            cd dist/notary
            ditto -c -k --keepParent "${asset}" "${asset}.zip"
          )
          xcrun notarytool submit "dist/notary/${asset}.zip" \
            --keychain-profile "${MACOS_NOTARY_PROFILE_EFFECTIVE}" \
            --keychain "${MACOS_RELEASE_KEYCHAIN}" \
            --wait
          spctl --assess --type execute --verbose=4 "${BINARY_PATH}"

      - name: Package release binary
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY_PATH: ${{ matrix.binary_path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="agentactr-${VERSION}-${TARGET}"
          cp "${BINARY_PATH}" "dist/${asset}"
          chmod 0755 "dist/${asset}"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          else
            shasum -a 256 "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          fi

      - name: Package signed and notarized macOS installer
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY_PATH: ${{ matrix.binary_path }}
        run: |
          set -euo pipefail
          asset="agentactr-${VERSION}-${TARGET}"
          pkg_root="${RUNNER_TEMP}/${asset}-pkgroot"
          unsigned_pkg="${RUNNER_TEMP}/${asset}.unsigned.pkg"
          signed_pkg="dist/${asset}.pkg"
          mkdir -p "${pkg_root}/usr/local/bin"
          cp "${BINARY_PATH}" "${pkg_root}/usr/local/bin/agentactr"
          chmod 0755 "${pkg_root}/usr/local/bin/agentactr"
          pkgbuild \
            --root "${pkg_root}" \
            --identifier "io.github.dwaiba.agentactr" \
            --version "${VERSION}" \
            --install-location "/" \
            "${unsigned_pkg}"
          productsign --sign "${MACOS_INSTALLER_IDENTITY_EFFECTIVE}" "${unsigned_pkg}" "${signed_pkg}"
          xcrun notarytool submit "${signed_pkg}" \
            --keychain-profile "${MACOS_NOTARY_PROFILE_EFFECTIVE}" \
            --keychain "${MACOS_RELEASE_KEYCHAIN}" \
            --wait
          xcrun stapler staple "${signed_pkg}"
          xcrun stapler validate "${signed_pkg}"
          spctl --assess --type install --verbose=4 "${signed_pkg}"
          shasum -a 256 "${signed_pkg}" > "${signed_pkg}.sha256"

      - name: Attest CLI binary archive
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: dist/agentactr-*.tar.gz

      - name: Attest macOS installer package
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: dist/agentactr-*.pkg

      - name: Upload CLI binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentactr-${{ matrix.target }}
          path: |
            dist/agentactr-*.tar.gz
            dist/agentactr-*.tar.gz.sha256
            dist/agentactr-*.pkg
            dist/agentactr-*.pkg.sha256
          if-no-files-found: error

  release:
    name: Publish release artifacts
    needs:
      - resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Depot configuration
        env:
          DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DEPOT_PROJECT_ID}" || { echo "DEPOT_PROJECT_ID repository/action variable is required" >&2; exit 1; }
          test -n "${DEPOT_TOKEN}" || { echo "DEPOT_TOKEN action secret is required" >&2; exit 1; }

      - name: Build and push runtime image with Depot
        id: runtime-image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: docker/agentactr-runtime/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dwaiba/agentactr-runtime:${{ needs.resolve-version.outputs.version }}-linux-arm64
            ghcr.io/dwaiba/agentactr-runtime:latest-linux-arm64
          build-args: |
            AGENTACTR_VERSION=${{ needs.resolve-version.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Build and push static CLI image with Depot
        id: cli-image
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ vars.DEPOT_PROJECT_ID }}
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: docker/agentactr-cli-static/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dwaiba/agentactr-cli:${{ needs.resolve-version.outputs.version }}-linux-arm64-musl
            ghcr.io/dwaiba/agentactr-cli:latest-linux-arm64-musl
          build-args: |
            AGENTACTR_VERSION=${{ needs.resolve-version.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Write image metadata
        env:
          RUNTIME_METADATA: ${{ steps.runtime-image.outputs.metadata }}
          CLI_METADATA: ${{ steps.cli-image.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir -p .agentactr/image-metadata
          printf '%s\n' "${RUNTIME_METADATA}" > .agentactr/image-metadata/agentactr-runtime.json
          printf '%s\n' "${CLI_METADATA}" > .agentactr/image-metadata/agentactr-cli-static.json

      - name: Write release notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p .agentactr/release
          notes=".agentactr/release/release-notes.md"
          printf 'agentactr %s\n\n' "${VERSION}" > "${notes}"
          if [ -n "${RELEASE_NOTES:-}" ]; then
            printf '%s\n\n' "${RELEASE_NOTES}" >> "${notes}"
          else
            printf '%s\n' \
              'Initial public preview release.' \
              '' \
              'Highlights:' \
              '- Rust CLI for provider-neutral coding-agent orchestration.' \
              '- Default Codex, GitHub, Git, Docker, and local artifact integrations.' \
              '- Run-scoped artifacts, trace/debug bundles, quality gates, and issue workflows.' \
              '- Docker runtime and static CLI images for linux/arm64.' \
              '- Native CLI binaries are not attached to this release; build locally from source.' \
              '- Secure-by-default lifecycle, manifest, and replay/audit hardening.' \
              '' >> "${notes}"
          fi
          printf '%s\n' \
            'Published images:' \
            "- \`ghcr.io/dwaiba/agentactr-runtime:${VERSION}-linux-arm64\`" \
            "- \`ghcr.io/dwaiba/agentactr-cli:${VERSION}-linux-arm64-musl\`" \
            '' \
            'Local CLI build:' \
            '- Native binary archives are intentionally omitted from this release. Build locally with `cargo build --release --bin agentactr` and use `target/release/agentactr`.' \
            '' \
            'GHCR may show an additional `unknown/unknown` manifest entry for each image. That entry is the attached BuildKit SBOM/provenance attestation manifest, not a second runnable image platform.' \
            >> "${notes}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: agentactr ${{ needs.resolve-version.outputs.version }}
          body_path: .agentactr/release/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            .agentactr/image-metadata/*.json
