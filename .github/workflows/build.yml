name: Build

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace --all-features

      - name: Build CLI
        run: cargo build --bin agentactr

      - name: Build release workspace
        run: cargo build --release --workspace --all-features

  docker:
    name: Dockerfile checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Check runtime Dockerfile
        run: docker buildx build --check --platform linux/arm64 -f docker/agentactr-runtime/Dockerfile .

      - name: Check static CLI Dockerfile
        run: docker buildx build --check --platform linux/arm64 -f docker/agentactr-cli-static/Dockerfile .
