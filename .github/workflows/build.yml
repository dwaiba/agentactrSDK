name: Build

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Check workspace
        run: cargo check --workspace --all-features

      - name: Build CLI
        run: cargo build --bin agentactr

      - name: Build release workspace
        run: cargo build --release --workspace --all-features

  docker:
    name: Dockerfile checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Check runtime Dockerfile
        run: docker buildx build --check --platform linux/arm64 -f docker/agentactr-runtime/Dockerfile .

      - name: Check static CLI Dockerfile
        run: docker buildx build --check --platform linux/arm64 -f docker/agentactr-cli-static/Dockerfile .
