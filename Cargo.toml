[workspace]
members = [
  "crates/agentactr-core",
  "crates/agentactr-sdk",
  "crates/agentactr-execution",
  "crates/agentactr-codex",
  "crates/agentactr-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
agentactr-codex = { path = "crates/agentactr-codex" }
agentactr-core = { path = "crates/agentactr-core" }
agentactr-execution = { path = "crates/agentactr-execution" }
agentactr-sdk = { path = "crates/agentactr-sdk" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
sha2 = "0.11"
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio"] }
sqlx-sqlite = { version = "0.9", default-features = false, features = ["bundled", "migrate"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "warn"
