<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="pre-commit scope">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .target { fill:#e8f3ff; }
    .gate { fill:#ecfdf5; }
    .unsafe { fill:#fef2f2; }
    .report { fill:#fff7ed; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .red { stroke:#991b1b; stroke-width:1.4; fill:none; marker-end:url(#redArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Pre-Commit Scope</text>

  <rect x="45" y="90" width="235" height="145" class="box target"/>
  <text x="70" y="120" class="title">Target repository</text>
  <text x="70" y="148" class="txt">isolated worktree repo/</text>
  <text x="70" y="172" class="txt">agent-authored diff</text>
  <text x="70" y="196" class="txt">target stack evidence</text>
  <text x="70" y="218" class="small">never agentactrSDK unless target</text>

  <rect x="355" y="55" width="235" height="120" class="box gate"/>
  <text x="380" y="85" class="title">1. Repo hooks</text>
  <text x="380" y="113" class="txt">pre-commit, lefthook</text>
  <text x="380" y="137" class="txt">husky, just, Taskfile, Makefile</text>

  <rect x="355" y="230" width="235" height="120" class="box gate"/>
  <text x="380" y="260" class="title">2. SDK defaults</text>
  <text x="380" y="288" class="txt">detected stack gates</text>
  <text x="380" y="312" class="txt">non-mutating final checks</text>

  <rect x="355" y="405" width="235" height="120" class="box gate"/>
  <text x="380" y="435" class="title">3. Config overrides</text>
  <text x="380" y="463" class="txt">agentactr.toml commands</text>
  <text x="380" y="487" class="txt">policy-reviewed exceptions</text>

  <rect x="675" y="90" width="205" height="145" class="box unsafe"/>
  <text x="700" y="120" class="title">Unsafe hook filter</text>
  <text x="700" y="148" class="txt">network or secrets</text>
  <text x="700" y="172" class="txt">destructive actions</text>
  <text x="700" y="196" class="txt">interactive prompts</text>
  <text x="700" y="218" class="small">fail closed by default</text>

  <rect x="675" y="330" width="205" height="145" class="box report"/>
  <text x="700" y="360" class="title">PreCommitReport</text>
  <text x="700" y="388" class="txt">commands and status</text>
  <text x="700" y="412" class="txt">stdout and stderr paths</text>
  <text x="700" y="436" class="txt">omission reasons</text>
  <text x="700" y="458" class="small">artifacted before commit</text>

  <rect x="945" y="205" width="140" height="150" class="box report"/>
  <text x="970" y="235" class="title">Commit gate</text>
  <text x="970" y="263" class="txt">all required pass</text>
  <text x="970" y="287" class="txt">scope validated</text>
  <text x="970" y="311" class="txt">report preserved</text>
  <text x="970" y="333" class="small">then local commit</text>

  <path d="M280 162 L355 115" class="line"/>
  <path d="M280 162 L355 290" class="line"/>
  <path d="M280 162 C320 300, 335 430, 355 465" class="line"/>
  <path d="M590 115 L675 162" class="line"/>
  <path d="M590 290 C640 265, 650 220, 675 190" class="line"/>
  <path d="M590 465 L675 402" class="line"/>
  <path d="M880 162 C920 180, 935 220, 945 260" class="red"/>
  <path d="M880 402 C925 385, 940 340, 945 300" class="line"/>
</svg>
