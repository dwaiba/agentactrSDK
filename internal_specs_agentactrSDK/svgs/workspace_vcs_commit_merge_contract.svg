<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-label="workspace VCS pre-commit commit and merge contract">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .ws { fill:#e8f3ff; }
    .git { fill:#ecfdf5; }
    .quality { fill:#fff7ed; }
    .merge { fill:#fef2f2; }
    .store { fill:#f8fafc; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .block { stroke:#991b1b; stroke-width:1.4; fill:none; marker-end:url(#redArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Workspace, VCS, Pre-Commit, Commit, and Merge Contract</text>

  <rect x="45" y="80" width="220" height="135" class="box git"/>
  <text x="70" y="110" class="title">Source checkout</text>
  <text x="70" y="138" class="txt">resolve base_ref</text>
  <text x="70" y="162" class="txt">require clean status</text>
  <text x="70" y="186" class="txt">record base_commit</text>

  <rect x="330" y="80" width="230" height="135" class="box ws"/>
  <text x="355" y="110" class="title">Isolated worktree</text>
  <text x="355" y="138" class="txt">.agentactr/workspaces</text>
  <text x="355" y="162" class="txt">repo, artifacts, codex</text>
  <text x="355" y="186" class="txt">role scoped access</text>

  <rect x="625" y="80" width="220" height="135" class="box store"/>
  <text x="650" y="110" class="title">Run metadata</text>
  <text x="650" y="138" class="txt">.agentactr-run.toml</text>
  <text x="650" y="162" class="txt">branch and git version</text>
  <text x="650" y="186" class="txt">touched-file index</text>

  <rect x="910" y="80" width="220" height="135" class="box quality"/>
  <text x="935" y="110" class="title">Agent work</text>
  <text x="935" y="138" class="txt">read-only explorers</text>
  <text x="935" y="162" class="txt">single implementer writer</text>
  <text x="935" y="186" class="txt">reviewer diff check</text>

  <rect x="45" y="330" width="220" height="145" class="box quality"/>
  <text x="70" y="360" class="title">Pre-commit gates</text>
  <text x="70" y="388" class="txt">repo hooks first</text>
  <text x="70" y="412" class="txt">SDK technology defaults</text>
  <text x="70" y="436" class="txt">explicit overrides</text>

  <rect x="330" y="330" width="230" height="145" class="box merge"/>
  <text x="355" y="360" class="title">Commit guard</text>
  <text x="355" y="388" class="txt">no unresolved intervention</text>
  <text x="355" y="412" class="txt">no unclassified files</text>
  <text x="355" y="436" class="txt">trailers required</text>

  <rect x="625" y="330" width="220" height="145" class="box merge"/>
  <text x="650" y="360" class="title">Merge plan</text>
  <text x="650" y="388" class="txt">default disabled</text>
  <text x="650" y="412" class="txt">base drift check</text>
  <text x="650" y="436" class="txt">overlap and policy check</text>

  <rect x="910" y="330" width="220" height="145" class="box store"/>
  <text x="935" y="360" class="title">Tracker finalization</text>
  <text x="935" y="388" class="txt">summary and labels</text>
  <text x="935" y="412" class="txt">PR only if enabled</text>
  <text x="935" y="436" class="txt">no protected push by default</text>

  <rect x="350" y="555" width="480" height="58" class="box merge"/>
  <text x="375" y="585" class="title">Fail-closed blockers: dirty source, write overlap, failed gates, base drift, missing trailers, or forbidden finalization</text>

  <path d="M265 147 L330 147" class="line"/>
  <path d="M560 147 L625 147" class="line"/>
  <path d="M845 147 L910 147" class="line"/>
  <path d="M1020 215 C1010 285, 930 315, 265 380" class="line"/>
  <path d="M265 402 L330 402" class="line"/>
  <path d="M560 402 L625 402" class="line"/>
  <path d="M845 402 L910 402" class="line"/>
  <path d="M445 475 C450 515, 500 540, 590 555" class="block"/>
  <path d="M735 475 C730 515, 690 540, 590 555" class="block"/>
</svg>
