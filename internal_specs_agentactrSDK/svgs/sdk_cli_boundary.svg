<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="SDK and default CLI boundary">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .core { fill:#e8f3ff; }
    .sdk { fill:#ecfdf5; }
    .adapter { fill:#fff7ed; }
    .cli { fill:#fef2f2; }
    .port { fill:#f8fafc; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .dashed { stroke:#6b7280; stroke-width:1.3; stroke-dasharray:7 5; fill:none; marker-end:url(#arrow); }
    .guard { fill:#fee2e2; stroke:#991b1b; stroke-width:1.2; rx:8; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">SDK and Default CLI Boundary</text>

  <rect x="45" y="70" width="235" height="150" class="box cli"/>
  <text x="68" y="100" class="title">agentactr CLI</text>
  <text x="68" y="128" class="txt">clap commands and banners</text>
  <text x="68" y="152" class="txt">config scaffolding and doctor</text>
  <text x="68" y="176" class="txt">default Codex and GitHub wiring</text>
  <text x="68" y="200" class="small">may call SDK APIs only</text>

  <rect x="45" y="270" width="235" height="125" class="box adapter"/>
  <text x="68" y="300" class="title">Default Adapters</text>
  <text x="68" y="328" class="txt">Codex runtime</text>
  <text x="68" y="352" class="txt">GitHub tracker</text>
  <text x="68" y="376" class="txt">Git, SQLite, OTLP, Linux cgroup</text>

  <rect x="375" y="70" width="260" height="150" class="box sdk"/>
  <text x="398" y="100" class="title">agentactr-sdk</text>
  <text x="398" y="128" class="txt">public Rust facade</text>
  <text x="398" y="152" class="txt">typed config and builders</text>
  <text x="398" y="176" class="txt">stable event schema</text>
  <text x="398" y="200" class="small">contains no default product assumptions</text>

  <rect x="375" y="270" width="260" height="185" class="box core"/>
  <text x="398" y="300" class="title">agentactr-core</text>
  <text x="398" y="328" class="txt">orchestration state machine</text>
  <text x="398" y="352" class="txt">spawn and recovery policy</text>
  <text x="398" y="376" class="txt">provider-neutral events</text>
  <text x="398" y="400" class="txt">commit and merge contracts</text>
  <text x="398" y="424" class="small">closed to provider-specific changes</text>

  <rect x="730" y="65" width="315" height="365" class="box port"/>
  <text x="755" y="96" class="title">Ports Owned by Core</text>
  <text x="755" y="128" class="txt">RuntimePort</text>
  <text x="755" y="152" class="txt">TrackerPort</text>
  <text x="755" y="176" class="txt">VersionControl</text>
  <text x="755" y="200" class="txt">MemoryController</text>
  <text x="755" y="224" class="txt">RunStore and LeaseStore</text>
  <text x="755" y="248" class="txt">TraceEmitter</text>
  <text x="755" y="272" class="txt">QualityRunner</text>
  <text x="755" y="296" class="txt">WorkspaceProvider</text>
  <text x="755" y="330" class="small">Adapters implement ports.</text>
  <text x="755" y="352" class="small">Core depends on abstractions.</text>
  <text x="755" y="374" class="small">CLI selects concrete defaults.</text>

  <rect x="350" y="505" width="420" height="72" class="guard"/>
  <text x="374" y="535" class="title">Boundary rule</text>
  <text x="374" y="559" class="txt">Codex, GitHub, cgroup, SQLite, OTLP, and CLI imports stay outside core.</text>

  <path d="M280 145 L375 145" class="line"/>
  <path d="M505 220 L505 270" class="line"/>
  <path d="M635 350 L730 230" class="line"/>
  <path d="M280 332 L375 355" class="dashed"/>
  <path d="M730 170 C660 150, 655 145, 635 145" class="dashed"/>
  <path d="M505 455 C505 480, 525 492, 560 505" class="line"/>
</svg>
