<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-label="cross-platform memory pressure semantics">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .common { fill:#e8f3ff; }
    .linux { fill:#ecfdf5; }
    .mac { fill:#fff7ed; }
    .warn { fill:#fef2f2; }
    .store { fill:#f8fafc; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .soft { stroke:#6b7280; stroke-width:1.3; stroke-dasharray:7 5; fill:none; marker-end:url(#arrow); }
    .red { stroke:#991b1b; stroke-width:1.4; fill:none; marker-end:url(#redArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Cross-Platform Memory Pressure Semantics</text>

  <rect x="65" y="70" width="300" height="165" class="box common"/>
  <text x="92" y="102" class="title">Same multi-agent orchestration</text>
  <text x="92" y="132" class="txt">Lead agent</text>
  <text x="92" y="156" class="txt">Explorer, reproducer, implementer</text>
  <text x="92" y="180" class="txt">Reviewer and finalizer</text>
  <text x="92" y="207" class="small">Agent graph is not platform-specific.</text>

  <rect x="465" y="55" width="290" height="195" class="box linux"/>
  <text x="492" y="88" class="title">Linux cgroup v2 / PSI path</text>
  <text x="492" y="118" class="txt">run memory group</text>
  <text x="492" y="142" class="txt">per-agent memory groups</text>
  <text x="492" y="166" class="txt">memory.high and memory.max</text>
  <text x="492" y="190" class="txt">memory.events and pressure samples</text>
  <text x="492" y="216" class="small">Granular enforcement is possible.</text>

  <rect x="850" y="55" width="270" height="195" class="box mac"/>
  <text x="877" y="88" class="title">Native macOS path</text>
  <text x="877" y="118" class="txt">process groups and exit status</text>
  <text x="877" y="142" class="txt">limited rlimit where useful</text>
  <text x="877" y="166" class="txt">process sampling and artifacts</text>
  <text x="877" y="190" class="txt">system-wide macOS pressure handling</text>
  <text x="877" y="216" class="small">No cgroup-equivalent per-agent box.</text>

  <rect x="65" y="345" width="300" height="155" class="box warn"/>
  <text x="92" y="377" class="title">Memory pressure rises</text>
  <text x="92" y="407" class="txt">Agents may use more memory</text>
  <text x="92" y="431" class="txt">Tool commands may spike usage</text>
  <text x="92" y="455" class="txt">Manager records status</text>
  <text x="92" y="479" class="small">Response depends on host substrate.</text>

  <rect x="465" y="320" width="290" height="210" class="box linux"/>
  <text x="492" y="352" class="title">Linux response</text>
  <text x="492" y="382" class="txt">sample pressure and event deltas</text>
  <text x="492" y="406" class="txt">pause new helper spawns</text>
  <text x="492" y="430" class="txt">request compaction when possible</text>
  <text x="492" y="454" class="txt">cancel lower-priority helper first</text>
  <text x="492" y="478" class="txt">preserve debug bundle on OOM</text>
  <text x="492" y="504" class="small">Some actions are milestone-gated.</text>

  <rect x="850" y="320" width="270" height="210" class="box mac"/>
  <text x="877" y="352" class="title">macOS native response now</text>
  <text x="877" y="382" class="txt">macOS compresses, reclaims, swaps</text>
  <text x="877" y="406" class="txt">macOS may kill a process</text>
  <text x="877" y="430" class="txt">agentactr observes degraded mode</text>
  <text x="877" y="454" class="txt">record failure and artifacts</text>
  <text x="877" y="478" class="txt">terminate process group on cancel</text>
  <text x="877" y="504" class="small">No per-agent proactive memory enforcement.</text>

  <rect x="365" y="590" width="455" height="55" class="box store"/>
  <text x="392" y="623" class="title">Both paths emit run events, memory status artifacts, process metadata, and debug bundles.</text>

  <path d="M365 152 L465 152" class="line"/>
  <path d="M365 152 C510 270, 690 270, 850 152" class="soft"/>
  <path d="M215 235 L215 345" class="line"/>
  <path d="M365 422 L465 422" class="line"/>
  <path d="M365 422 C510 565, 720 565, 850 422" class="soft"/>
  <path d="M610 530 C600 558, 595 575, 592 590" class="line"/>
  <path d="M985 530 C955 570, 890 590, 820 617" class="line"/>
  <path d="M985 250 L985 320" class="red"/>
</svg>
