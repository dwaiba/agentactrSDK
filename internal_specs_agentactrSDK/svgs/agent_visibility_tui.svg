<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">Read-only agent visibility TUI contract</title>
  <desc id="desc">Shows the CLI TUI rendering layer consuming artifacts and trace events without becoming an orchestration or mutation path.</desc>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:8}.safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.4;rx:8}.warn{fill:#fefce8;stroke:#a16207;stroke-width:1.4;rx:8}.text{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}.small{font-family:Arial,sans-serif;font-size:12px;fill:#334155}.arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect x="35" y="60" width="195" height="135" class="box"/><text x="55" y="94" class="text">Artifact inputs</text><text x="55" y="118" class="small">context_manifest</text><text x="55" y="134" class="small">agent_graph</text><text x="55" y="150" class="small">spawn_handoffs</text><text x="55" y="166" class="small">quality/finalization</text>
  <rect x="295" y="60" width="185" height="135" class="box"/><text x="315" y="94" class="text">Trace inputs</text><text x="315" y="118" class="small">events.jsonl</text><text x="315" y="134" class="small">ts_unix_ms latest</text><text x="315" y="150" class="small">status/events</text>
  <rect x="545" y="48" width="210" height="160" class="safe"/><text x="565" y="82" class="text">CLI HCI renderer</text><text x="565" y="106" class="small">--color auto|always|never</text><text x="565" y="122" class="small">NO_COLOR respected</text><text x="565" y="138" class="small">JSON never colored</text><text x="565" y="154" class="small">--snapshot deterministic</text><text x="565" y="170" class="small">no state mutation</text>
  <rect x="825" y="60" width="175" height="135" class="warn"/><text x="845" y="94" class="text">Terminal panes</text><text x="845" y="118" class="small">agent graph</text><text x="845" y="134" class="small">selected details</text><text x="845" y="150" class="small">quality/lifecycle</text><text x="845" y="166" class="small">diagnostics</text>
  <path d="M230 128 H545" class="arrow"/><path d="M480 128 H545" class="arrow"/><path d="M755 128 H825" class="arrow"/>
</svg>
