<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="default Codex GitHub agent graph">
  <style>
    .node { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .lead { fill:#e0f2fe; }
    .ro { fill:#ecfdf5; }
    .wr { fill:#fff7ed; }
    .rv { fill:#fef2f2; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .title { font:700 14px Arial,sans-serif; fill:#111827; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow2); }
  </style>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="365" y="25" width="210" height="68" class="node lead"/>
  <text x="392" y="53" class="title">Codex Lead Agent</text>
  <text x="392" y="77" class="txt">owns plan and synthesis</text>

  <rect x="55" y="150" width="180" height="70" class="node ro"/>
  <text x="82" y="178" class="title">Repo Explorer</text>
  <text x="82" y="202" class="txt">read-only</text>

  <rect x="275" y="150" width="180" height="70" class="node ro"/>
  <text x="302" y="178" class="title">Reproducer</text>
  <text x="302" y="202" class="txt">tests and logs</text>

  <rect x="495" y="150" width="180" height="70" class="node wr"/>
  <text x="522" y="178" class="title">Implementer</text>
  <text x="522" y="202" class="txt">single writer</text>

  <rect x="715" y="150" width="180" height="70" class="node rv"/>
  <text x="742" y="178" class="title">Reviewer</text>
  <text x="742" y="202" class="txt">diff and risk</text>

  <rect x="385" y="305" width="180" height="70" class="node lead"/>
  <text x="412" y="333" class="title">Finalizer</text>
  <text x="412" y="357" class="txt">GitHub comment/labels</text>

  <path d="M410 93 C310 115, 220 125, 145 150" class="line"/>
  <path d="M450 93 C420 120, 390 130, 365 150" class="line"/>
  <path d="M500 93 C535 120, 560 130, 585 150" class="line"/>
  <path d="M545 93 C650 120, 735 130, 805 150" class="line"/>
  <path d="M585 220 C570 260, 535 285, 475 305" class="line"/>
  <path d="M805 220 C720 270, 610 295, 565 320" class="line"/>
</svg>
