<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-label="quality gates">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .input { fill:#e8f3ff; }
    .gate { fill:#ecfdf5; }
    .block { fill:#fef2f2; }
    .out { fill:#fff7ed; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .red { stroke:#991b1b; stroke-width:1.4; fill:none; marker-end:url(#redArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Quality Gates</text>

  <rect x="45" y="70" width="215" height="125" class="box input"/>
  <text x="70" y="100" class="title">Run ownership</text>
  <text x="70" y="128" class="txt">claim fencing token</text>
  <text x="70" y="152" class="txt">Codex completed</text>
  <text x="70" y="176" class="txt">no intervention pending</text>

  <rect x="320" y="70" width="215" height="125" class="box input"/>
  <text x="345" y="100" class="title">Repository readiness</text>
  <text x="345" y="128" class="txt">stack selected</text>
  <text x="345" y="152" class="txt">workspace from base</text>
  <text x="345" y="176" class="txt">clean source recorded</text>

  <rect x="595" y="70" width="215" height="125" class="box gate"/>
  <text x="620" y="100" class="title">Scope and contention</text>
  <text x="620" y="128" class="txt">diff or no-change reason</text>
  <text x="620" y="152" class="txt">no outside writes</text>
  <text x="620" y="176" class="txt">no overlap block</text>

  <rect x="870" y="70" width="215" height="125" class="box gate"/>
  <text x="895" y="100" class="title">Technology gates</text>
  <text x="895" y="128" class="txt">pre-commit passed</text>
  <text x="895" y="152" class="txt">pinned tools available</text>
  <text x="895" y="176" class="txt">dependency integrity passed</text>

  <rect x="45" y="295" width="215" height="125" class="box gate"/>
  <text x="70" y="325" class="title">Architecture and tests</text>
  <text x="70" y="353" class="txt">SOLID checks or waiver</text>
  <text x="70" y="377" class="txt">tests ran or reason</text>
  <text x="70" y="401" class="txt">reviewer accepted</text>

  <rect x="320" y="295" width="215" height="125" class="box gate"/>
  <text x="345" y="325" class="title">Commit and merge</text>
  <text x="345" y="353" class="txt">local commit when required</text>
  <text x="345" y="377" class="txt">merge plan clean or disabled</text>
  <text x="345" y="401" class="txt">trailers present</text>

  <rect x="595" y="295" width="215" height="125" class="box gate"/>
  <text x="620" y="325" class="title">Runtime health</text>
  <text x="620" y="353" class="txt">memory final status clean</text>
  <text x="620" y="377" class="txt">rate-limit state recorded</text>
  <text x="620" y="401" class="txt">final summary exists</text>

  <rect x="870" y="295" width="215" height="125" class="box out"/>
  <text x="895" y="325" class="title">Terminal decision</text>
  <text x="895" y="353" class="txt">PASS: finalize by policy</text>
  <text x="895" y="377" class="txt">FAIL: preserve artifacts</text>
  <text x="895" y="401" class="txt">REVIEW: block mutation</text>

  <rect x="290" y="535" width="600" height="70" class="box block"/>
  <text x="315" y="565" class="title">Any failed required gate blocks terminal success mutation</text>
  <text x="315" y="589" class="txt">The report names the gate, evidence artifact, policy source, and recovery action.</text>

  <path d="M260 132 L320 132" class="line"/>
  <path d="M535 132 L595 132" class="line"/>
  <path d="M810 132 L870 132" class="line"/>
  <path d="M977 195 C970 260, 905 285, 260 350" class="line"/>
  <path d="M260 357 L320 357" class="line"/>
  <path d="M535 357 L595 357" class="line"/>
  <path d="M810 357 L870 357" class="line"/>
  <path d="M977 420 C950 500, 780 520, 590 535" class="red"/>
</svg>
