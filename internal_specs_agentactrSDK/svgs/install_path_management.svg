<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Release binary installation and PATH contract</title>
  <desc id="desc">Spec diagram for release archive install, conservative PATH handling, optional completions, and optional shell profile mutation.</desc>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:8}
    .safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.5;rx:8}
    .warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5;rx:8}
    .data{fill:#eef2ff;stroke:#4338ca;stroke-width:1.5;rx:8}
    .text{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#334155}
    .arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="210" height="100" class="data"/>
  <text x="60" y="93" class="text">Release artifact</text>
  <text x="60" y="119" class="small">native binary archive</text>
  <text x="60" y="137" class="small">sha256/provenance outside script</text>
  <path d="M250 110 H320" class="arrow"/>

  <rect x="320" y="60" width="220" height="100" class="safe"/>
  <text x="340" y="93" class="text">Installer script</text>
  <text x="340" y="119" class="small">user-writable bin dir</text>
  <text x="340" y="137" class="small">no privilege escalation</text>
  <path d="M540 110 H610" class="arrow"/>

  <rect x="610" y="60" width="200" height="100" class="safe"/>
  <text x="630" y="93" class="text">Installed binary</text>
  <text x="630" y="119" class="small">agentactr --version</text>
  <text x="630" y="137" class="small">must execute successfully</text>
  <path d="M810 110 H880" class="arrow"/>

  <rect x="880" y="60" width="160" height="100" class="box"/>
  <text x="900" y="93" class="text">PATH guidance</text>
  <text x="900" y="119" class="small">printed by default</text>
  <text x="900" y="137" class="small">shell-specific</text>

  <rect x="320" y="235" width="220" height="95" class="box"/>
  <text x="340" y="268" class="text">Completions</text>
  <text x="340" y="294" class="small">optional only</text>
  <text x="340" y="312" class="small">generated by CLI</text>
  <path d="M430 160 V235" class="arrow"/>

  <rect x="610" y="235" width="250" height="95" class="warn"/>
  <text x="630" y="268" class="text">Shell profile edits</text>
  <text x="630" y="294" class="small">explicit opt-in only</text>
  <text x="630" y="312" class="small">never silent mutation</text>
  <path d="M540 282 H610" class="arrow"/>
</svg>
