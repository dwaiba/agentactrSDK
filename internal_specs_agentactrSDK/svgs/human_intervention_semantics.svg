<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="human intervention semantics">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .state { fill:#e8f3ff; }
    .policy { fill:#ecfdf5; }
    .stop { fill:#fef2f2; }
    .review { fill:#fff7ed; }
    .ok { fill:#f0fdf4; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .dashed { stroke:#6b7280; stroke-width:1.3; stroke-dasharray:7 5; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Human Intervention Semantics</text>

  <rect x="42" y="85" width="210" height="86" class="box state"/>
  <text x="67" y="115" class="title">Run starts</text>
  <text x="67" y="140" class="txt">policy snapshot recorded</text>
  <text x="67" y="160" class="small">banner prints value and source</text>

  <rect x="320" y="55" width="220" height="95" class="box policy"/>
  <text x="345" y="85" class="title">fail_closed</text>
  <text x="345" y="111" class="txt">Codex approval: never</text>
  <text x="345" y="133" class="small">default unattended mode</text>

  <rect x="320" y="180" width="220" height="95" class="box policy"/>
  <text x="345" y="210" class="title">interactive</text>
  <text x="345" y="236" class="txt">Codex approval: on-request</text>
  <text x="345" y="258" class="small">CLI prompt is explicit event</text>

  <rect x="320" y="305" width="220" height="95" class="box review"/>
  <text x="345" y="335" class="title">review_required</text>
  <text x="345" y="361" class="txt">run unattended</text>
  <text x="345" y="383" class="small">terminal mutation waits</text>

  <rect x="320" y="430" width="220" height="95" class="box review"/>
  <text x="345" y="460" class="title">auto_policy</text>
  <text x="345" y="486" class="txt">signed or local policy</text>
  <text x="345" y="508" class="small">allow listed operations only</text>

  <rect x="625" y="65" width="205" height="105" class="box stop"/>
  <text x="650" y="95" class="title">Approval needed</text>
  <text x="650" y="121" class="txt">unsafe diff, prompt, auth,</text>
  <text x="650" y="143" class="txt">missing capability, ambiguity</text>

  <rect x="625" y="225" width="205" height="105" class="box state"/>
  <text x="650" y="255" class="title">Intervention event</text>
  <text x="650" y="281" class="txt">human_intervention.*</text>
  <text x="650" y="303" class="small">stored in JSONL and SQLite</text>

  <rect x="625" y="385" width="205" height="105" class="box ok"/>
  <text x="650" y="415" class="title">Quality and finalization</text>
  <text x="650" y="441" class="txt">continue only when policy</text>
  <text x="650" y="463" class="txt">permits terminal mutation</text>

  <rect x="895" y="75" width="180" height="95" class="box stop"/>
  <text x="920" y="105" class="title">Fail run</text>
  <text x="920" y="131" class="txt">fail_closed blocks</text>
  <text x="920" y="153" class="small">no hidden prompt path</text>

  <rect x="895" y="235" width="180" height="95" class="box review"/>
  <text x="920" y="265" class="title">Operator decision</text>
  <text x="920" y="291" class="txt">approve, deny, or edit config</text>
  <text x="920" y="313" class="small">source is recorded</text>

  <rect x="895" y="395" width="180" height="95" class="box ok"/>
  <text x="920" y="425" class="title">Finalize</text>
  <text x="920" y="451" class="txt">after gates pass</text>
  <text x="920" y="473" class="small">GitHub mutation by policy</text>

  <path d="M252 128 L320 102" class="line"/>
  <path d="M252 128 L320 228" class="line"/>
  <path d="M252 128 L320 353" class="line"/>
  <path d="M252 128 C285 270, 295 415, 320 478" class="line"/>
  <path d="M540 102 L625 116" class="line"/>
  <path d="M540 228 L625 277" class="line"/>
  <path d="M540 353 L625 437" class="line"/>
  <path d="M540 478 L625 437" class="line"/>
  <path d="M830 116 L895 122" class="line"/>
  <path d="M830 277 L895 282" class="line"/>
  <path d="M830 437 L895 442" class="line"/>
  <path d="M985 330 C985 360, 965 378, 895 420" class="dashed"/>
</svg>
