<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Configuration rendering and version provenance surface</title>
  <desc id="desc">Shows agentactr TOML writers, generated comments, Codex project config, and build-time version metadata.</desc>
  <style>
    .box { fill:#f8fafc; stroke:#334155; stroke-width:1.4; rx:8; }
    .safe { fill:#ecfdf5; stroke:#047857; stroke-width:1.4; rx:8; }
    .data { fill:#eef2ff; stroke:#4338ca; stroke-width:1.4; rx:8; }
    .text { font-family:Arial, sans-serif; font-size:15px; fill:#0f172a; }
    .small { font-family:Arial, sans-serif; font-size:12px; fill:#334155; }
    .arrow { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="35" y="45" width="190" height="90" class="box"/>
  <text x="55" y="76" class="text">CLI write paths</text>
  <text x="55" y="101" class="small">init</text>
  <text x="55" y="117" class="small">doctor --fix-codex-config</text>

  <rect x="285" y="45" width="210" height="90" class="safe"/>
  <text x="305" y="76" class="text">SDK render layer</text>
  <text x="305" y="101" class="small">deterministic TOML</text>
  <text x="305" y="117" class="small"># possible values comments</text>

  <rect x="555" y="45" width="190" height="90" class="data"/>
  <text x="575" y="76" class="text">repo files</text>
  <text x="575" y="101" class="small">agentactr.toml</text>
  <text x="575" y="117" class="small">.codex/config.toml</text>

  <rect x="805" y="45" width="190" height="90" class="box"/>
  <text x="825" y="76" class="text">runtime launch</text>
  <text x="825" y="101" class="small">explicit -c overrides</text>
  <text x="825" y="117" class="small">no project-local profiles</text>

  <rect x="35" y="215" width="220" height="90" class="box"/>
  <text x="55" y="246" class="text">build.rs</text>
  <text x="55" y="271" class="small">git rev-parse HEAD</text>
  <text x="55" y="287" class="small">rustc --version</text>

  <rect x="315" y="215" width="240" height="90" class="data"/>
  <text x="335" y="246" class="text">compile-time env</text>
  <text x="335" y="271" class="small">AGENTACTR_BUILD_GIT_SHA</text>
  <text x="335" y="287" class="small">AGENTACTR_BUILD_RUSTC_VERSION</text>

  <rect x="615" y="215" width="230" height="90" class="safe"/>
  <text x="635" y="246" class="text">agentactr --version</text>
  <text x="635" y="271" class="small">package version</text>
  <text x="635" y="287" class="small">git_sha and rustc</text>

  <path d="M225 90 H285" class="arrow"/>
  <path d="M495 90 H555" class="arrow"/>
  <path d="M745 90 H805" class="arrow"/>
  <path d="M255 260 H315" class="arrow"/>
  <path d="M555 260 H615" class="arrow"/>
</svg>
