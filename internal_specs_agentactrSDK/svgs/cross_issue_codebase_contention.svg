<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="cross-issue codebase contention">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .run { fill:#e8f3ff; }
    .index { fill:#ecfdf5; }
    .risk { fill:#fef2f2; }
    .ok { fill:#fff7ed; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .small { font:12px Arial,sans-serif; fill:#374151; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .red { stroke:#991b1b; stroke-width:1.4; fill:none; marker-end:url(#redArrow); }
    .green { stroke:#047857; stroke-width:1.4; fill:none; marker-end:url(#greenArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#047857"/>
    </marker>
  </defs>

  <text x="36" y="34" class="title">Cross-Issue Codebase Contention</text>

  <rect x="45" y="80" width="220" height="130" class="box run"/>
  <text x="70" y="110" class="title">Run A</text>
  <text x="70" y="138" class="txt">issue github#101</text>
  <text x="70" y="162" class="txt">base abc123</text>
  <text x="70" y="186" class="small">files_read, written, deleted</text>

  <rect x="45" y="285" width="220" height="130" class="box run"/>
  <text x="70" y="315" class="title">Run B</text>
  <text x="70" y="343" class="txt">issue github#102</text>
  <text x="70" y="367" class="txt">base abc123 or newer</text>
  <text x="70" y="391" class="small">files_read, written, deleted</text>

  <rect x="345" y="115" width="280" height="250" class="box index"/>
  <text x="370" y="145" class="title">Active touched-file index</text>
  <text x="370" y="175" class="txt">repo_id</text>
  <text x="370" y="199" class="txt">base_commit</text>
  <text x="370" y="223" class="txt">run_id and issue_id</text>
  <text x="370" y="247" class="txt">files_read</text>
  <text x="370" y="271" class="txt">files_written</text>
  <text x="370" y="295" class="txt">files_deleted</text>
  <text x="370" y="319" class="txt">lock_kind read, write, merge-risk</text>

  <rect x="700" y="60" width="180" height="115" class="box ok"/>
  <text x="725" y="90" class="title">Read overlap</text>
  <text x="725" y="118" class="txt">allowed</text>
  <text x="725" y="142" class="small">shared observation only</text>

  <rect x="700" y="210" width="180" height="115" class="box risk"/>
  <text x="725" y="240" class="title">Write or delete overlap</text>
  <text x="725" y="268" class="txt">disallowed active runs</text>
  <text x="725" y="292" class="small">generated files included</text>

  <rect x="700" y="360" width="180" height="115" class="box risk"/>
  <text x="725" y="390" class="title">Post-success overlap</text>
  <text x="725" y="418" class="txt">later run merge_risk</text>
  <text x="725" y="442" class="small">finalization gated</text>

  <rect x="945" y="135" width="145" height="115" class="box risk"/>
  <text x="970" y="165" class="title">fail_closed</text>
  <text x="970" y="193" class="txt">quality fails</text>
  <text x="970" y="217" class="small">no auto finish</text>

  <rect x="945" y="320" width="145" height="115" class="box ok"/>
  <text x="970" y="350" class="title">review_required</text>
  <text x="970" y="378" class="txt">block terminal</text>
  <text x="970" y="402" class="small">operator finalize</text>

  <path d="M265 145 L345 200" class="line"/>
  <path d="M265 350 L345 280" class="line"/>
  <path d="M625 235 C660 175, 675 120, 700 118" class="green"/>
  <path d="M625 245 L700 267" class="red"/>
  <path d="M625 285 C660 350, 675 415, 700 418" class="red"/>
  <path d="M880 267 C920 245, 930 215, 945 192" class="red"/>
  <path d="M880 418 C920 405, 930 385, 945 378" class="line"/>
</svg>
