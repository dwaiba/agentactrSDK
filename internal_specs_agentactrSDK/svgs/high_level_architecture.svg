<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="agentactrSDK Codex and GitHub architecture">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.5; rx:8; }
    .core { fill:#e8f3ff; }
    .adapter { fill:#f8fafc; }
    .mem { fill:#ecfdf5; }
    .store { fill:#fff7ed; }
    .title { font:700 15px Arial,sans-serif; fill:#111827; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="30" y="45" width="220" height="135" class="box adapter"/>
  <text x="55" y="75" class="title">GitHub Adapter</text>
  <text x="55" y="105" class="txt">Issues / PRs / comments</text>
  <text x="55" y="130" class="txt">REST + GraphQL</text>
  <text x="55" y="155" class="txt">Rate-limit aware</text>

  <rect x="30" y="220" width="220" height="130" class="box adapter"/>
  <text x="55" y="250" class="title">Codex Runtime</text>
  <text x="55" y="280" class="txt">CLI process mode</text>
  <text x="55" y="305" class="txt">App-server mode target</text>
  <text x="55" y="330" class="txt">Sub-agent sessions</text>

  <rect x="355" y="40" width="280" height="420" class="box core"/>
  <text x="385" y="70" class="title">agentactr Core</text>
  <text x="385" y="105" class="txt">Rust CLI / daemon</text>
  <text x="385" y="130" class="txt">Workflow policy snapshot</text>
  <text x="385" y="155" class="txt">Scheduler + lease manager</text>
  <text x="385" y="180" class="txt">Agent graph + spawn manager</text>
  <text x="385" y="205" class="txt">Workspace coordinator</text>
  <text x="385" y="230" class="txt">Budget + memory controller</text>
  <text x="385" y="255" class="txt">Tool and ACI registry</text>
  <text x="385" y="280" class="txt">Guardrails and approvals</text>
  <text x="385" y="305" class="txt">Run event reducer</text>
  <text x="385" y="330" class="txt">Trace and debug emitter</text>

  <rect x="720" y="45" width="220" height="135" class="box mem"/>
  <text x="745" y="75" class="title">Linux Memory Plane</text>
  <text x="745" y="105" class="txt">cgroup v2 per run</text>
  <text x="745" y="130" class="txt">PSI pressure triggers</text>
  <text x="745" y="155" class="txt">OOM and reclaim events</text>

  <rect x="720" y="220" width="220" height="150" class="box store"/>
  <text x="745" y="250" class="title">State and Debug</text>
  <text x="745" y="280" class="txt">SQLite run store</text>
  <text x="745" y="305" class="txt">JSONL event log</text>
  <text x="745" y="330" class="txt">OTLP / tracing spans</text>
  <text x="745" y="355" class="txt">Artifacts and debug bundles</text>

  <path d="M250 115 C300 115, 320 125, 355 150" class="line"/>
  <path d="M250 285 C300 285, 320 275, 355 255" class="line"/>
  <path d="M635 230 C675 190, 690 150, 720 120" class="line"/>
  <path d="M635 320 C675 320, 690 320, 720 320" class="line"/>
  <path d="M355 360 C300 365, 270 350, 250 320" class="line"/>
</svg>
