<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-label="Linux memory pressure event flow">
  <style>
    .b { fill:#ffffff; stroke:#111827; stroke-width:1.4; rx:8; }
    .k { fill:#ecfdf5; }
    .a { fill:#e8f3ff; }
    .d { fill:#fff7ed; }
    .txt { font:13px Arial,sans-serif; fill:#111827; }
    .title { font:700 14px Arial,sans-serif; fill:#111827; }
    .line { stroke:#374151; stroke-width:1.4; fill:none; marker-end:url(#arrow3); }
  </style>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="30" y="95" width="170" height="72" class="b k"/>
  <text x="58" y="123" class="title">Kernel files</text>
  <text x="58" y="147" class="txt">memory.pressure</text>

  <rect x="250" y="95" width="170" height="72" class="b a"/>
  <text x="278" y="123" class="title">PSI watcher</text>
  <text x="278" y="147" class="txt">poll/epoll trigger</text>

  <rect x="470" y="35" width="180" height="72" class="b a"/>
  <text x="500" y="63" class="title">Sampler</text>
  <text x="500" y="87" class="txt">current/stat/events</text>

  <rect x="470" y="165" width="180" height="72" class="b a"/>
  <text x="500" y="193" class="title">Policy engine</text>
  <text x="500" y="217" class="txt">choose action</text>

  <rect x="700" y="95" width="200" height="72" class="b d"/>
  <text x="728" y="123" class="title">Action + trace</text>
  <text x="728" y="147" class="txt">compact/cancel/debug</text>

  <path d="M200 131 L250 131" class="line"/>
  <path d="M420 120 C445 95, 450 75, 470 70" class="line"/>
  <path d="M560 107 L560 165" class="line"/>
  <path d="M650 201 C690 185, 710 160, 700 140" class="line"/>
</svg>
