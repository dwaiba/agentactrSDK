<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Issue proposal and submission commands</title>
  <desc id="desc">Shows tracker-backed and local issue drafting, deferred dedupe, proposal review, submit-time GitHub dedupe, ledger, and GitHub mutation paths.</desc>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:8}.safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.4;rx:8}.warn{fill:#fefce8;stroke:#a16207;stroke-width:1.4;rx:8}.mut{fill:#fff7ed;stroke:#c2410c;stroke-width:1.4;rx:8}.text{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}.small{font-family:Arial,sans-serif;font-size:12px;fill:#334155}.arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect x="30" y="45" width="165" height="82" class="box"/><text x="50" y="78" class="text">issue find</text><text x="50" y="102" class="small">GitHub read</text><text x="50" y="118" class="small">candidate inventory</text>
  <rect x="245" y="35" width="205" height="92" class="safe"/><text x="265" y="68" class="text">issue draft --repo</text><text x="265" y="92" class="small">tracker-backed</text><text x="265" y="108" class="small">dedupe before proposals</text>
  <rect x="245" y="160" width="205" height="92" class="safe"/><text x="265" y="193" class="text">issue draft --local</text><text x="265" y="217" class="small">no tracker adapter</text><text x="265" y="233" class="small">dedupe = deferred</text>
  <rect x="500" y="92" width="175" height="82" class="safe"/><text x="520" y="125" class="text">issue proposals</text><text x="520" y="149" class="small">review local set</text><text x="520" y="165" class="small">no mutation</text>
  <rect x="725" y="92" width="165" height="82" class="warn"/><text x="745" y="125" class="text">submit policy</text><text x="745" y="149" class="small">--yes required</text><text x="745" y="165" class="small">deferred recomputed</text>
  <rect x="940" y="92" width="150" height="82" class="mut"/><text x="960" y="125" class="text">GitHub write</text><text x="960" y="149" class="small">create issue</text><text x="960" y="165" class="small">link if parented</text>
  <rect x="305" y="295" width="210" height="62" class="box"/><text x="325" y="322" class="text">Codex draft/review</text><text x="325" y="342" class="small">planner network/auth explicit</text>
  <rect x="620" y="295" width="230" height="62" class="box"/><text x="640" y="322" class="text">SQLite ledger</text><text x="640" y="342" class="small">submission_digest after target</text>
  <path d="M195 86 H245" class="arrow"/><path d="M450 81 H500" class="arrow"/><path d="M450 206 H475 V133 H500" class="arrow"/><path d="M675 133 H725" class="arrow"/><path d="M890 133 H940" class="arrow"/><path d="M348 252 V295" class="arrow"/><path d="M808 174 V295" class="arrow"/>
</svg>
