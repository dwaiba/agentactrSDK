<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Install and PATH management</title>
  <desc id="desc">Shows conservative release archive installation, optional completions, optional shell profile updates, and version verification.</desc>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:8}
    .safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.5;rx:8}
    .warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5;rx:8}
    .data{fill:#eef2ff;stroke:#4338ca;stroke-width:1.5;rx:8}
    .text{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}
    .small{font-family:Arial,sans-serif;font-size:12px;fill:#334155}
    .arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="35" y="55" width="205" height="105" class="data"/>
  <text x="55" y="88" class="text">release archive</text>
  <text x="55" y="114" class="small">agentactr-VERSION-TARGET</text>
  <text x="55" y="132" class="small">single native binary</text>
  <text x="55" y="150" class="small">sha256 sidecar in release</text>
  <path d="M240 108 H310" class="arrow"/>

  <rect x="310" y="55" width="220" height="105" class="safe"/>
  <text x="330" y="88" class="text">install-agentactr.sh</text>
  <text x="330" y="114" class="small">default: $HOME/.local/bin</text>
  <text x="330" y="132" class="small">--bin-dir for override</text>
  <text x="330" y="150" class="small">copy, chmod, atomic mv</text>
  <path d="M530 108 H600" class="arrow"/>

  <rect x="600" y="55" width="205" height="105" class="safe"/>
  <text x="620" y="88" class="text">post-install verify</text>
  <text x="620" y="114" class="small">agentactr --version</text>
  <text x="620" y="132" class="small">git_sha and rustc</text>
  <text x="620" y="150" class="small">fail if binary unusable</text>
  <path d="M805 108 H875" class="arrow"/>

  <rect x="875" y="55" width="170" height="105" class="box"/>
  <text x="895" y="88" class="text">manual PATH</text>
  <text x="895" y="114" class="small">zsh/bash/fish</text>
  <text x="895" y="132" class="small">PowerShell/Elvish</text>
  <text x="895" y="150" class="small">printed by default</text>

  <rect x="310" y="235" width="220" height="95" class="box"/>
  <text x="330" y="268" class="text">optional completions</text>
  <text x="330" y="294" class="small">--install-completions</text>
  <text x="330" y="312" class="small">generated by CLI command</text>
  <path d="M420 160 V235" class="arrow"/>

  <rect x="600" y="235" width="250" height="95" class="warn"/>
  <text x="620" y="268" class="text">optional profile mutation</text>
  <text x="620" y="294" class="small">--update-shell-profile only</text>
  <text x="620" y="312" class="small">never silent shell edits</text>
  <path d="M530 282 H600" class="arrow"/>
</svg>
