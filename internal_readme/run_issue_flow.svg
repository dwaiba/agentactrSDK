<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">run issue flow</title>
  <desc id="desc">Shows worktree preparation, issue context, memory controller, Codex runtime, quality, and review finalization.</desc>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:1.4;rx:8}.safe{fill:#ecfdf5;stroke:#047857;stroke-width:1.4;rx:8}.warn{fill:#fefce8;stroke:#a16207;stroke-width:1.4;rx:8}.text{font-family:Arial,sans-serif;font-size:15px;fill:#0f172a}.small{font-family:Arial,sans-serif;font-size:12px;fill:#334155}.arrow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
  <rect x="35" y="55" width="145" height="90" class="box"/><text x="55" y="88" class="text">run issue</text><text x="55" y="113" class="small">parse policy</text><text x="55" y="129" class="small">print banner</text>
  <rect x="225" y="55" width="160" height="90" class="box"/><text x="245" y="88" class="text">Git worktree</text><text x="245" y="113" class="small">base ref</text><text x="245" y="129" class="small">runtime config copy</text>
  <rect x="430" y="55" width="160" height="90" class="box"/><text x="450" y="88" class="text">issue context</text><text x="450" y="113" class="small">GitHub REST</text><text x="450" y="129" class="small">stack labels</text>
  <rect x="635" y="55" width="170" height="90" class="safe"/><text x="655" y="88" class="text">memory prep</text><text x="655" y="113" class="small">cgroups/leases</text><text x="655" y="129" class="small">process attribution</text>
  <rect x="850" y="55" width="190" height="90" class="warn"/><text x="870" y="88" class="text">Codex cli_json</text><text x="870" y="113" class="small">JSONL stdout</text><text x="870" y="129" class="small">prompt artifacts</text>
  <rect x="325" y="225" width="180" height="90" class="box"/><text x="345" y="258" class="text">quality gates</text><text x="345" y="283" class="small">detected stack</text><text x="345" y="299" class="small">status artifact</text>
  <rect x="555" y="225" width="190" height="90" class="box"/><text x="575" y="258" class="text">trace/debug</text><text x="575" y="283" class="small">events.jsonl</text><text x="575" y="299" class="small">debug bundle</text>
  <rect x="795" y="225" width="210" height="90" class="safe"/><text x="815" y="258" class="text">finalization policy</text><text x="815" y="283" class="small">require human review</text><text x="815" y="299" class="small">finalize approve/reject</text>
  <path d="M180 100 H225" class="arrow"/><path d="M385 100 H430" class="arrow"/><path d="M590 100 H635" class="arrow"/><path d="M805 100 H850" class="arrow"/><path d="M945 145 C900 200 760 220 745 245" class="arrow"/><path d="M850 145 C760 210 610 220 505 245" class="arrow"/><path d="M505 270 H555" class="arrow"/><path d="M745 270 H795" class="arrow"/>
</svg>
