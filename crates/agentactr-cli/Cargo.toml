[package]
name = "agentactr-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "agentactr"
path = "src/main.rs"

[dependencies]
agentactr-codex = { path = "../agentactr-codex" }
agentactr-execution = { path = "../agentactr-execution" }
agentactr-sdk = { path = "../agentactr-sdk" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.11"
sqlx-core = { version = "0.8", default-features = false, features = ["_rt-tokio"] }
sqlx-sqlite = { version = "0.8", default-features = false, features = ["bundled", "migrate"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
